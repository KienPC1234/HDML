[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hdml"
version = "0.1.0"
description = "Hierarchical Decision Mamba-Liquid for 3D Robot Control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "mamba-ssm>=2.0.0",
    "causal-conv1d>=1.4.0",
    "ncps>=0.0.8",
    "gymnasium>=0.29.1",
    "mujoco>=3.1.0",
    "einops>=0.7.0",
    "timm>=0.9.16",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hdml*"]
