model:
  prop_dim: 17
  action_dim: 6
  d_model: 128
  d_state: 16
  d_conv: 4
  expand: 2
  num_mamba_layers: 3
  d_subgoal: 64
  cfc_units: 32
  cfc_backbone_units: 64
  cfc_backbone_layers: 1
  cfc_residual: 0.5
  use_visual: false
  dropout: 0.1
  device: cuda
training:
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_steps: 300
  max_epochs: 6
  batch_size: 64
  context_length: 20
  gamma: 0.99
  grad_clip_norm: 1.0
  eval_interval: 3
  save_interval: 3
  seed: 42
  output_dir: checkpoints/halfcheetah_medium
  log_dir: logs/halfcheetah_medium
  flow_weight: 1.0
  q_weight: 1.0
  value_weight: 1.0
  pave_weight: 0.1
  dynamics_weight: 0.1
  grad_caps_weight: 0.05
  use_advantage_weighting: true
  advantage_temperature: 1.0
env:
  env_name: HalfCheetah-v4
  max_episode_steps: 1000
  target_return: 6000.0
  scale_return: 1000.0
  num_eval_episodes: 5
  seed: 42
