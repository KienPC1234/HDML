model:
  prop_dim: 376
  action_dim: 17
  d_model: 256
  d_state: 32
  d_conv: 4
  expand: 2
  num_mamba_layers: 4
  d_subgoal: 128
  cfc_units: 64
  cfc_backbone_units: 128
  cfc_backbone_layers: 1
  use_visual: false
  dropout: 0.1
  device: "cuda"

training:
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_steps: 500
  max_epochs: 20
  batch_size: 32
  context_length: 30
  gamma: 0.99
  grad_clip_norm: 1.0
  action_loss_weight: 1.0
  subgoal_loss_weight: 0.1
  reg_loss_weight: 0.01
  eval_interval: 5
  save_interval: 5
  seed: 42
  output_dir: "checkpoints/humanoid_v4"
  log_dir: "logs/humanoid_v4"

env:
  env_name: "Humanoid-v4"
  max_episode_steps: 1000
  target_return: 6000.0
  scale_return: 1000.0
  num_eval_episodes: 5
  seed: 42
