model:
  prop_dim: 348
  action_dim: 17
  d_model: 256
  d_state: 32
  d_conv: 4
  expand: 2
  num_mamba_layers: 4
  d_subgoal: 128
  cfc_units: 64
  cfc_backbone_units: 128
  cfc_backbone_layers: 2
  cfc_residual: 0.05
  use_visual: false
  dropout: 0.1
  action_policy: flow
  chunk_size: 5
  use_native_mamba3: true
  mamba3_headdim: 64
  mamba3_ngroups: 1
  mamba3_rope_fraction: 0.5
  mamba3_outproj_norm: false
  mamba3_chunk: 64
  device: cuda
training:
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_steps: 500
  max_epochs: 40
  batch_size: 256
  context_length: 20
  gamma: 0.99
  grad_clip_norm: 1.0
  eval_interval: 5
  save_interval: 5
  seed: 42
  use_amp: true
  amp_dtype: bfloat16
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  use_fast_dataset: true
  use_tensorboard: false
  use_wandb: false
  output_dir: checkpoints/rebuild_unitree/humanoid_placeholder
  log_dir: logs/rebuild_unitree
  flow_weight: 1.0
  q_weight: 1.0
  value_weight: 1.0
  action_weight: 1.0
  pave_weight: 0.001
  pave_interval: 4
  dynamics_weight: 0.1
  use_advantage_weighting: true
  advantage_temperature: 1.0
  grad_caps_weight: 0.01
  reg_loss_weight: 0.01
  subgoal_loss_weight: 0.1
env:
  env_name: Humanoid-v5
  max_episode_steps: 1000
  target_return: 5000.0
  scale_return: 1000.0
  num_eval_episodes: 5
  seed: 42
