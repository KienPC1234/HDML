model:
  prop_dim: 53
  action_dim: 12
  d_model: 192
  d_state: 16
  d_conv: 4
  expand: 2
  num_mamba_layers: 4
  d_subgoal: 53
  cfc_units: 48
  cfc_backbone_units: 96
  cfc_backbone_layers: 1
  cfc_residual: 0.05
  use_visual: false
  dropout: 0.1
  action_policy: gaussian
  device: cuda
training:
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_steps: 400
  max_epochs: 40
  batch_size: 128
  context_length: 30
  gamma: 0.99
  grad_clip_norm: 1.0
  eval_interval: 2
  save_interval: 5
  seed: 42
  use_amp: true
  amp_dtype: bfloat16
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  use_fast_dataset: true
  use_tensorboard: true
  use_wandb: false
  output_dir: checkpoints/unitree_a1_maze
  log_dir: logs/unitree_a1_maze
  flow_weight: 1.0
  q_weight: 1.0
  pave_weight: 0.001
  dynamics_weight: 0.1
  use_advantage_weighting: true
  advantage_temperature: 1.0
  grad_caps_weight: 0.01
env:
  env_name: UnitreeA1Maze-v0
  max_episode_steps: 900
  target_return: 1.0
  scale_return: 1.0
  num_eval_episodes: 5
  seed: 42
