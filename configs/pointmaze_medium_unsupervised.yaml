model:
  prop_dim: 6
  action_dim: 2
  chunk_size: 4
  d_model: 128
  d_state: 16
  d_conv: 4
  expand: 2
  num_mamba_layers: 3
  d_subgoal: 32
  cfc_units: 32
  cfc_backbone_units: 64
  cfc_backbone_layers: 1
  dropout: 0.1

training:
  batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.0001
  max_epochs: 5
  warmup_steps: 500
  grad_clip_norm: 1.0
  context_length: 25
  subgoal_loss_weight: 0.5
  dynamics_weight: 1.0
  grad_caps_weight: 0.1
  reg_loss_weight: 0.0
  use_amp: true
  amp_dtype: "bfloat16"
  seed: 42
  output_dir: "checkpoints/pointmaze_medium"
  log_dir: "logs/pointmaze_medium"

env:
  env_name: "PointMaze_Medium-v3"
  target_return: 1.0
  scale_return: 1.0
