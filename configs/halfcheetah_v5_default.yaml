model:
  prop_dim: 17
  action_dim: 6
  d_model: 128
  d_state: 16
  d_conv: 4
  expand: 2
  num_mamba_layers: 3
  d_subgoal: 64
  cfc_units: 32
  cfc_backbone_units: 64
  cfc_backbone_layers: 1
  use_visual: false
  dropout: 0.1
  device: "cuda"

training:
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_steps: 300
  max_epochs: 15
  batch_size: 64
  context_length: 20
  gamma: 0.99
  grad_clip_norm: 1.0
  action_loss_weight: 1.0
  subgoal_loss_weight: 0.1
  reg_loss_weight: 0.01
  use_advantage_weighting: true
  advantage_temperature: 1.0
  eval_interval: 3
  save_interval: 5
  seed: 42
  use_amp: true
  amp_dtype: "bfloat16"
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true
  use_fast_dataset: true
  use_tensorboard: true
  use_wandb: false
  output_dir: "checkpoints/halfcheetah_v5"
  log_dir: "logs/halfcheetah_v5"

env:
  env_name: "HalfCheetah-v5"
  max_episode_steps: 1000
  target_return: 4000.0
  scale_return: 1000.0
  num_eval_episodes: 5
  seed: 42
